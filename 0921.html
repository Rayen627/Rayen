<html>
    <head>
        <title>0921-css簡介</title>
        <!-- html的註解 -->
        <style> /* CSS又稱樣式表 */ /* CSS又稱樣式表 */
        /* 選擇器:selector 有三種 標籤名稱,#id,.class */
        /*
          display: block/inline/inline-bloc;
          width: px; pixal像素
          height: px;
          
          color:前景顏色
          background-color: 背景顏色

          顏色的設定方法:
          1.英文單字
          2.rgb(0~255,0~255,0~255)
          3.rgba(紅光0~255,綠光0~255,藍光0~255,可見度0~1) //0全透明~1不透明
          4.色碼 #RRGGBB  00~FF
          5.hsl(色相0~360,彩度0~1,亮度0~100%)
          6.hsla(色相0~360,彩度0~100%,可見度0~1) //0全透明~1不透明
        */
           p{
              background-color: lightgray;
           }
           #p1{
             background-color:  lightblue;
           }
           .c1{
              color: red;
           }
           #d1{
              background-color:  rgba(61, 189, 67, 0.5);
              height: 50px;
              width: 50px;
           }
        </style>
    </head>
    <body>
        <P id="p1" class="c1">第一個段落<br>123</P>
        <P style="color:blue">第二個段落</P>
        <P class="c1" style="color:black">第三個段落</P>
        <div id="d1" class="dc1"></div>
        <div class="dc1"></div>
    </body>
</html>
